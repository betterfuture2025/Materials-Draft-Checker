const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(password) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:fromB64(SALT), iterations:100000, hash:'SHA-256'},
    keyMat,
    {name:'AES-GCM', length:256},
    false, ['decrypt']
  );
  const plaintext = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(IV)}, key, fromB64(CIPHER));
  return new TextDecoder().decode(plaintext);
}
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const html = await unlock(pwd);
    document.open();
    document.write(html);
    document.close();
  } catch (ex) {
    err.textContent = 'Wrong password';
    document.getElementById('pwd').select();
  }
});
</script>
